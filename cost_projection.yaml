assumptions: "Un backend/frontend en EC2 pequeño, RDS single-AZ, un procesamiento EMR mensual y consultas Athena de bajo volumen; detener recursos fuera de las sesiones de trabajo."
line_items:
  - service: "RDS"
    detail: "PostgreSQL db.t4g.micro, 20 GB, single-AZ"
    monthly_usd: 14.0
  - service: "EC2"
    detail: "t3.small para backend y frontend"
    monthly_usd: 15.2
  - service: "S3"
    detail: "CSV raw, Parquet curado y resultados Athena"
    monthly_usd: 1.0
  - service: "Athena"
    detail: "Consultas del panel sobre Parquet particionado por mes"
    monthly_usd: 0.5
  - service: "EMR"
    detail: "Una ejecución mensual con m4.large, dimensionada al dataset y terminación automática"
    monthly_usd: 1.0
